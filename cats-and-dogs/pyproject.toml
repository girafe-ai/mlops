[project]
name = "cats-and-dogs"
version = "0.1.0"
description = "Image classification challenge from Azira: Cats vs Dogs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.64.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5.6",
    "mlflow>=3.5.1",
    "numpy>=2.3.4",
    "tensorboardx>=2.6.4",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]

[dependency-groups]
dev = [
    "fire>=0.7.1",
    "jupyter>=1.1.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 100
format = { docstring-code-format = true }

[tool.ruff.lint]
select = [
    # isort
    "I",
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-builtins
    "A",
    # flake8-return
    "RET",
    # flake8-use-pathlib
    "PTH",
    # flynt
    "FLY",
    # mccabe
    "C90",
    # NumPy-specific rules
    "NPY",
    # pep8-naming
    "N",
    # Ruff-specific rules
    "RUF",
    # Pylint - very strict, may be use when have enough time
    "PL",
    # refurb - also may be overwhelming
    "FURB",
]

pycodestyle = { max-doc-length = 105 }

# [tool.ruff.lint.per-file-ignores]
# "__init__.py" = ["E402"]
# "**/{tests,docs,tools}/*" = ["E402"]
