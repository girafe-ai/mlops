services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-seminar-postgres
    environment:
      POSTGRES_USER: seminar
      POSTGRES_PASSWORD: seminar
      POSTGRES_DB: seminar_db
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seminar -d seminar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sql-seminar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@seminar.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
