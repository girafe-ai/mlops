stages:
  metadata:
    cmd: uv run python scripts/build_metadata.py
    deps:
      - conf
      - scripts/build_metadata.py
      - src/cityscapes_tools/metadata.py
      - data/cityscapes/gtFine
    outs:
      - data/metadata

  filter:
    cmd: uv run python scripts/materialize_filtered_dataset.py
    deps:
      - conf
      - scripts/materialize_filtered_dataset.py
      - src/cityscapes_tools/postgres.py
      - sql
      - data/metadata
    outs:
      - data/processed/filtered_manifest.csv
    metrics:
      - reports/filtered_summary.json
