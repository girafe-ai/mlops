stages:
  metadata:
    cmd: uv run cityscapes-build-metadata
    deps:
      - src/cityscapes_tools/conf/conf.yaml
      - src/cityscapes_tools/conf/data/data.yaml
      - src/cityscapes_tools/cli/build_metadata.py
      - src/cityscapes_tools/pipelines/metadata.py
      - data/cityscapes/gtFine
    outs:
      - data/metadata

  filter:
    cmd: uv run cityscapes-materialize
    deps:
      - src/cityscapes_tools/conf/conf.yaml
      - src/cityscapes_tools/conf/data/data.yaml
      - src/cityscapes_tools/conf/preprocess/preprocess.yaml
      - src/cityscapes_tools/conf/database/postgres.yaml
      - src/cityscapes_tools/cli/materialize_dataset.py
      - src/cityscapes_tools/pipelines/postgres.py
      - src/cityscapes_tools/pipelines/sql
      - data/metadata
    outs:
      - data/processed/filtered_manifest.csv
    metrics:
      - reports/filtered_summary.json
