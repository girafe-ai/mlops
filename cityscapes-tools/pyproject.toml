[project]
name = "cityscapes-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.67.1",
    "hydra-core>=1.3.7",
    "lightning>=2.6.6",
    "mlflow>=3.17.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]

[project.scripts]
cityscapes-download = "cityscapes_tools.cli.download:main"
cityscapes-build-metadata = "cityscapes_tools.cli.build_metadata:main"
cityscapes-materialize = "cityscapes_tools.cli.materialize_dataset:main"
cityscapes-train-torch = "cityscapes_tools.cli.train_torch:main"
cityscapes-train-lightning = "cityscapes_tools.cli.train_lightning:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fire>=0.7.1",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
    "pytest>=9.1.1",
]
